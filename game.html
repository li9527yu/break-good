<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地下班次 · 实验室</title><link rel="stylesheet" href="game/game.css"><link rel="stylesheet" href="game/scene.css"><link rel="stylesheet" href="game/three.css"><body>
<main class="game-shell"><header class="game-bar"><div class="brand">地下班次</div><div id="day"></div><button id="menu-open" aria-haspopup="dialog">菜单</button></header>
<section class="room" aria-label="实验室"><canvas id="lab-canvas" aria-label="地下实验室三维场景"></canvas><div id="world-labels"></div><p id="scene-loading">正在搭建地下实验室…</p></section>
<dialog id="event-layer" aria-label="场景事件"><button id="event-close" aria-label="收起界面，回到场景">收起 ×</button><section id="object-info" hidden><h2 id="object-title"></h2><p id="object-description"></p></section><section class="panel" id="panel" aria-labelledby="title"><div class="portrait-wrap"><img id="portrait" alt=""><p id="portrait-name"></p><small id="channel"></small></div><div class="content"><div class="heading"><small id="type"></small><h1 id="title" tabindex="-1"></h1></div><p id="text"></p><div id="interaction"></div><p id="feedback" role="status"></p></div></section>
<div id="reactor-host" hidden></div></dialog><section class="scene-hud"><button id="travel">走向当前事件 ↗</button></section></main><dialog id="time-skip" aria-labelledby="skip-title"><small>UNDERGROUND SHIFT</small><h2 id="skip-title">几天之后</h2><p id="skip-subtitle"></p><button id="skip-continue">继续故事 →</button></dialog>
<dialog id="notes"><h2>个人笔记</h2><p>这里只记录你亲历或已知的信息。</p><div id="note-list"></div><button data-close="notes">返回</button></dialog>
<dialog id="menu"><h2>暂停菜单</h2><p id="save-status" role="status"></p><button id="notes-open">个人笔记</button><details id="camera-menu"><summary>视角与场景</summary><div class="camera-tools"><button id="view-toggle">查看夹层</button></div><p>左键拖动旋转，右键拖动平移，滚轮缩放。</p></details><label>字号 <select id="font"><option value="normal">标准</option><option value="large">较大</option></select></label><div class="menu-actions"><button id="export">导出存档</button><label class="file-button">导入存档<input id="import" type="file" accept="application/json,.json"></label><button id="restart-day">从本章开始重玩</button><button id="new-game">重新开始故事</button><button data-close="menu">返回故事</button></div><p id="menu-feedback" role="status"></p></dialog>
<script src="game/story.js"></script><script src="game/lab.js"></script><script src="game/engine.js"></script><script src="game/reactor-workbench.js"></script><script src="game/app.js"></script><script src="vendor/scene3d.js"></script></body></html>
